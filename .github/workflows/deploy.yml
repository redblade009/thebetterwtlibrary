name: Deploy Hugo Site
on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Hugo Compiler
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # FIXED: Uses standard double quotes and custom path flags to force Hugo to ignore old environment variables
      - name: Initialize Module Environment
        run: |
          rm -f go.mod config.toml config.yaml
          hugo mod init "://github.com"
          hugo mod get "://github.com"

      - name: Compile 7,500 Full-Text Notes
        run: hugo --minify

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
