name: Deploy Hugo Site
on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIXED: Downloads the theme as a raw zip file, avoiding all Git / Module command bugs
      - name: Install Blowfish Layouts Natively
        run: |
          mkdir -p themes
          wget https://github.com
          unzip main.zip
          mv blowfish-main themes/blowfish
          rm main.zip

      # Re-establishes a completely fresh Hugo compiler container
      - name: Setup Hugo Compiler
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.125.0' # Uses a locked, hyper-stable release build
          extended: true

      - name: Compile 7,500 Full-Text Notes
        run: hugo --minify

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
