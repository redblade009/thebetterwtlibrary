name: Deploy Hugo Site
on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIXED: Creates a raw local skeleton theme structure so Hugo doesn't need to download anything from the web
      - name: Create Internal Theme Fallbacks
        run: |
          mkdir -p themes/blowfish/layouts/_default
          
          # 1. Build the base HTML container layout sheet
          cat << 'EOF' > themes/blowfish/layouts/_default/baseof.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>{{ .Title }}</title>
            <style>
              body { font-family: sans-serif; margin: 40px; background: #111; color: #eee; }
              input { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; font-size: 16px; }
              #results { margin-top: 20px; }
              .result-item { background: #222; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
              a { color: #58a6ff; text-decoration: none; font-weight: bold; }
            </style>
          </head>
          <body>
            {{ block "main" . }}{{ end }}
          </body>
          </html>
          EOF

          # 2. Build the main layout interface template file
          cat << 'EOF' > themes/blowfish/layouts/_default/list.html
          {{ define "main" }}
          <h1>{{ .Title }}</h1>
          <input type="text" id="search-input" placeholder="Type to search all 7,500 notes instantly...">
          <div id="results"></div>

          <script>
            let index = [];
            // Dynamically loads the deep full-text index file generated by Hugo
            fetch('{{ "index.json" | relURL }}')
              .then(response => response.json())
              .then(data => index = data);

            document.getElementById('search-input').addEventListener('input', (e) => {
              const query = e.target.value.toLowerCase();
              const resultsDiv = document.getElementById('results');
              resultsDiv.innerHTML = '';
              if(!query) return;

              const matches = index.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.content.toLowerCase().includes(query)
              ).slice(0, 20); // Top 20 relevant results shown cleanly

              matches.forEach(item => {
                resultsDiv.innerHTML += `<div class="result-item"><a href="${item.permalink}">${item.title}</a><p>${item.content.substring(0, 160)}...</p></div>`;
              });
            });
          </script>
          {{ end }}
          EOF

          # 3. Mirror layouts to single items to prevent structural build panic warnings
          cp themes/blowfish/layouts/_default/list.html themes/blowfish/layouts/_default/single.html

          # 4. Build the structural Full-Text Data Extraction Layout
          mkdir -p themes/blowfish/layouts/home
          cat << 'EOF' > themes/blowfish/layouts/home.json
          [
            {{- range $i, $e := .Site.RegularPages -}}
            {{- if $i -}},{{- end -}}
            {
              "title": {{ $e.Title | jsonify }},
              "permalink": {{ $e.Permalink | jsonify }},
              "content": {{ $e.Plain | jsonify }}
            }
            {{- end -}}
          ]
          EOF
          cp themes/blowfish/layouts/home.json themes/blowfish/layouts/index.json

      - name: Setup Hugo Compiler
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Compile 7,500 Full-Text Notes
        run: hugo --minify

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
