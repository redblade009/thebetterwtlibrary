baseURL: "https://github.io"
title: "Better WT Library"

# Configures Hugo to fetch the layout components directly via its Go engine
module:
  imports:
    - path: "://github.com"

hasCJKLanguage: true
enableRobotsTXT: true

outputs:
  home: ["HTML", "RSS", "JSON"] # Compiles the complete full-text paragraph search file matrix

params:
  search:
    enable: true
    showDialogueHeader: true
    enableShortcuts: true
    layout: "canary"
